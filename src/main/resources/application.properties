spring.application.name=issue-desk
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/issue_desk}
spring.datasource.username=${DATABASE_USERNAME:issue_desk}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.password=${DEMO_PASSWORD:IssueDesk-demo-2026!}
logging.level.org.springframework.security=INFO
